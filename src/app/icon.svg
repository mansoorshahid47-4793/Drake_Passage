<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="dp-title">
  <title id="dp-title">Drake Passage</title>
  <!-- P (teal), drawn first so the sail-D sits in front of its stem -->
  <path fill="#0F8286" fill-rule="evenodd" d="M36 12h11c8.5 0 13 5 13 12s-4.5 12-13 12h-5v10h-6zm6 6v12h5c4.5 0 7-2.5 7-6s-2.5-6-7-6z"/>
  <!-- White knockout so the D reads as interlocked with the P -->
  <path fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round" d="M12 2c20 0 30 10 30 22 0 10-6 18-16 22L12 36z"/>
  <!-- D as a sail (navy): sharp head, vertical luff, curved leech, diagonal foot; sail-shaped counter -->
  <path fill="#0B2545" fill-rule="evenodd" d="M12 2c20 0 30 10 30 22 0 10-6 18-16 22L12 36zm5.5 7v24l9 7c6-3 10-9 10-16 0-9-6.5-15-19-15z"/>
  <!-- Nested inner sail (navy) -->
  <path fill="#0B2545" d="M21.5 12.5l10.5 21-10.5-5.5z"/>
  <!-- Waves: navy, teal-bright, navy -->
  <path fill="none" stroke="#0B2545" stroke-width="2.8" stroke-linecap="round" d="M8 51c7.5-5 15-5 22.5 0s15 5 22.5 0"/>
  <path fill="none" stroke="#22B8BC" stroke-width="2.8" stroke-linecap="round" d="M4 56c9-5 18-5 27 0s18 5 27 0"/>
  <path fill="none" stroke="#0B2545" stroke-width="2.8" stroke-linecap="round" d="M10 61c7.5-5 15-5 22.5 0s15 5 22.5 0"/>
</svg>
